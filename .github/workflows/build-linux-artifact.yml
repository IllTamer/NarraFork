name: Build linux artifact

# Fork-only test build; does not publish releases, tags, or update feeds.
on:
  push:
    branches: [build/ldap-auth]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'IllTamer/NarraFork'
    name: Build linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build binary with embedded frontend
        env:
          NF_BUILD_GITHUB_REPOSITORY: IllTamer/NarraFork
        run: bun scripts/build-cross-platform.ts --platform=linux-x64
      - name: Record source and checksum
        run: |
          git rev-parse HEAD > dist/BUILD_COMMIT
          sha256sum dist/narrafork-*-linux-x64 > dist/BUILD_SHA256SUMS
      - name: Upload binary and metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: narrafork-linux-x64
          path: |
            dist/narrafork-*-linux-x64
            dist/narrafork-*-linux-x64.metadata.json
            dist/BUILD_COMMIT
            dist/BUILD_SHA256SUMS
          if-no-files-found: error
          retention-days: 7
